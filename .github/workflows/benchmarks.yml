name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Compile benchmarks
        run: npx tsc benchmarks.ts --esModuleInterop --resolveJsonModule --skipLibCheck || npm run build
      - name: Run benchmarks
        run: npm run benchmark
      - name: Upload benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-log
          path: |
            benchmarks.js
          if-no-files-found: ignore
