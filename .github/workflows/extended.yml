name: Extended Modules

on:
  push:
    branches: [main]
    paths:
      - 'extended/**'
      - 'b+tree.ts'
      - 'package.json'
      - '.github/workflows/extended.yml'
  pull_request:
    paths:
      - 'extended/**'
      - 'b+tree.ts'
      - 'package.json'
      - '.github/workflows/extended.yml'
  workflow_dispatch:

jobs:
  extended:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify extended build outputs
        run: |
          test -d extended
          test -f extended/index.js
          test -f extended/union.js
          test -f extended/intersect.js
          test -f extended/subtract.js
          test -f extended/diffAgainst.js
          test -f extended/bulkLoad.js
      - name: Run extended-focused tests
        run: npx jest test/union.test.ts test/intersect.test.ts test/subtract.test.ts test/diffAgainst.test.ts test/bulkLoad.test.ts --verbose
