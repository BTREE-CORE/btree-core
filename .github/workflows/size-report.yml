name: Size Report

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sizes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run sizes
      - name: Upload size log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: size-report
          path: |
            b+tree.js
            b+tree.min.js
          if-no-files-found: ignore

